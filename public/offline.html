<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Apex Home Fitness — Offline</title>
    <!--
      Offline fallback page served by the service worker when navigation
      fails (no network, nothing cached for the requested URL).

      Self-contained by design:
        - inline styles only (no external CSS; CSP style-src allows inline),
        - no scripts, no external fonts, no network calls,
        - the only asset is the same-origin app icon (img-src 'self').

      See docs/ASSETS.md for the cache/fallback policy.
    -->
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      .card {
        max-width: 22rem;
        margin: 2rem;
        padding: 2.5rem 2rem;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        box-shadow: 0 20px 45px -25px rgba(15, 23, 42, 0.35);
      }
      .icon {
        width: 88px;
        height: 88px;
        margin: 0 auto 1.25rem;
        display: block;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        line-height: 1.4;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.7;
        color: #475569;
      }
      .fa {
        margin-top: 0.75rem;
        padding-top: 0.75rem;
        border-top: 1px solid #e2e8f0;
        direction: rtl;
        font-size: 0.9rem;
        color: #64748b;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #f1f5f9;
        }
        .card {
          background: #1e293b;
          border-color: #334155;
        }
        p,
        .fa {
          color: #cbd5e1;
        }
        .fa {
          border-top-color: #334155;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="icon" src="/icons/icon.svg" alt="" width="88" height="88" />
      <h1>You're offline</h1>
      <p>Reconnect to the internet to keep training.</p>
      <p class="fa" lang="fa" dir="rtl">آفلاین هستید — برای ادامه تمرین به اینترنت متصل شوید.</p>
    </main>
  </body>
</html>
