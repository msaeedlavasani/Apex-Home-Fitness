name: CI Full E2E (nightly)

on:
  schedule:
    # Nightly full regression — 22:00 UTC (runs the complete E2E suite that
    # per-commit CI deliberately does not: see .github/workflows/ci.yml).
    - cron: '0 22 * * *'
  workflow_dispatch: # manual trigger for release / high-risk validation

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      env:
        DATABASE_URL: file:./ci.db

    - name: Apply database migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: file:./ci.db

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright browser (chromium) + OS dependencies
      run: npx playwright install --with-deps chromium

    - name: Run full E2E regression suite
      run: npm run test:e2e:full
      env:
        DATABASE_URL: file:./ci.db
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    - name: Upload Playwright report (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report
          test-results
        retention-days: 14
        if-no-files-found: warn
