name: CI

# Task-branch CI: every ordinary push to a supported task branch (fix/feat/
# feature/refactor/recovery/hotfix) plus main/master gets fast confidence
# (static → unit → build → targeted E2E). PR integration CI still runs for
# pull requests to main/master. The full 100+ E2E suite stays on the nightly
# nightly/manual workflow (ci-full-e2e.yml) — NEVER run full E2E on every push.
on:
  push:
    branches:
      - main
      - master
      - 'fix/**'
      - 'feat/**'
      - 'feature/**'
      - 'refactor/**'
      - 'recovery/**'
      - 'hotfix/**'
  pull_request:
    branches: [ main, master ]

# Fail fast: if a newer commit lands on the same ref, cancel the queued run —
# never waste minutes on stale results.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Static checks + production build.
  # Anything failing here stops the pipeline: the `e2e` job below declares
  # `needs: build`, so it never even starts when this job fails (fail-fast).
  #
  # Env: only placeholder values are provided — never real secrets. The app
  # builds and renders with unset Supabase/Sentry/OpenAI vars (graceful
  # fallbacks), and the covered flows never touch auth or the DB.
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      env:
        # Placeholder only — enough for `prisma generate` (runs as the
        # @prisma/client postinstall during npm ci). No real secrets in CI.
        DATABASE_URL: file:./ci.db

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Apply database migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: file:./ci.db

    - name: Lint
      run: npm run lint

    - name: Type check
      run: npm run typecheck

    - name: Unit tests
      run: npm test

    - name: Production build
      run: npm run build
      env:
        DATABASE_URL: file:./ci.db
        # Injected only from GitHub Repository Secrets; never hard-coded.
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  # ---------------------------------------------------------------------------
  # End-to-end smoke tests (Playwright, chromium).
  # Runs only after `build` succeeds. Per-commit E2E is intentionally FAST:
  #  1. auth-flow with AUTH_OTP_MODE=mock — OTP UI, route protection, session
  #     behaviour, without any real SMS/Supabase credentials;
  #  2. main-flows in open mode — the core signed-out product journey.
  # The FULL regression suite is preserved and runs nightly / on demand via
  # .github/workflows/ci-full-e2e.yml, so ordinary commits are not slowed
  # down by the whole 100+ test suite.
  #
  # AUTH_OTP_MODE=mock never mints sessions — the login API fails honestly
  # (503) when no Supabase env is present. Real provider journeys stay in
  # controlled staging/manual environments with protected credentials
  # (see docs/OTP_LAUNCH_READINESS.md).
  # ---------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      env:
        DATABASE_URL: file:./ci.db

    - name: Apply database migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: file:./ci.db

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install Playwright browser (chromium) + OS dependencies
      run: npx playwright install --with-deps chromium

    - name: Run E2E auth tests (mock OTP mode)
      run: npm run test:e2e:auth
      env:
        # Mock OTP mode: route protection + auth UI without external credentials.
        AUTH_OTP_MODE: mock
        DATABASE_URL: file:./ci.db
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    - name: Run E2E smoke tests (core journey, open mode)
      run: npm run test:e2e:smoke
      env:
        # Open mode (no auth arming): the product journey runs as a signed-out
        # visitor, matching how the app degrades without Supabase/SMS creds.
        DATABASE_URL: file:./ci.db
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    - name: Upload Playwright report (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report
          test-results
        retention-days: 14
        if-no-files-found: warn
